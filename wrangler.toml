# Cloudflare Workers deployment. See "Cloudflare Workers" in README.md.
name = "mijnwindparknl"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Serve the site on its own domain. The zone mijnwindpark.nl must be in this
# Cloudflare account; deploying creates the DNS record and certificate.
routes = [
  { pattern = "mijnwindpark.nl", custom_domain = true },
]

# Durable HARMONIE snapshots (harmonie/v1/{model}/{run}.json).
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mijnwindpark"

# Every hour at five past: store the newest HARMONIE P1 and P2b runs.
[triggers]
crons = ["5 * * * *"]

[observability]
enabled = true

# Worker Previews (PR branches) need their own bindings. They share the production
# bucket: previews only read data and store the same KNMI snapshots as production.
[[previews.r2_buckets]]
binding = "BUCKET"
bucket_name = "mijnwindpark"
